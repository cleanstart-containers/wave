apiVersion: v1
kind: Namespace
metadata:
  name: wave
  labels:
    app: wave
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wave
  namespace: wave
  labels:
    app: wave
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wave
  labels:
    app: wave
rules:
  # Core resources the controller needs
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - events
      - namespaces
      - secrets
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - daemonsets
      - replicasets
      - statefulsets
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Leader election (required for --enable-leader-election)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wave
  labels:
    app: wave
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wave
subjects:
  - kind: ServiceAccount
    name: wave
    namespace: wave
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wave
  namespace: wave
  labels:
    app: wave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wave
  template:
    metadata:
      labels:
        app: wave
    spec:
      serviceAccountName: wave
      containers:
      - name: wave
        image: cleanstart/wave:latest-dev
        # Alternative: Use digest for immutable deployments
        # image: cleanstart/wave@sha256:3aa9d824fa90aa132f087470507f704a7eb97d5dad6a13f32eb099d8fc56cd9f
        imagePullPolicy: IfNotPresent
        # Entrypoint: /usr/bin/wave
        command: ["/usr/bin/wave"]
        env:
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca-certificates.crt
        - name: PATH
          value: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: wave
  namespace: wave
  labels:
    app: wave
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: wave

